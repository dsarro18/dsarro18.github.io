# When a post is added or edited, fill in search tags, homepage link,
# sitemap.xml and feed.xml, then commit the result back.
name: Update SEO, sitemap and feed

on:
  push:
    branches: [main]
    paths: ["*.html"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/seo.py .
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-update SEO tags, sitemap and feed"
            git push
          fi
